# Builds https://giotto-suite.github.io/GiottoDisk/
#
# The build itself lives in giotto-suite/.github and is shared by every package
# site in the org. This file says which site this is, and carries the one thing
# that is genuinely specific to GiottoDisk: how its dependencies are resolved.
#
# WHY resolve-packages AND pins RATHER THAN ORDINARY RESOLUTION
# pak cannot solve this package's dependency graph:
#
#   Could not solve package dependencies: deps::.: dependency conflict
#
# GiottoDisk pins GiottoClass@gsource and GiottoUtils@dev, while Giotto@gsource
# and GiottoClass@gsource declare BARE remotes for those same packages. Pinned
# versus bare for one package is what pak refuses to solve.
#
# So resolve a clean tree against the release line, where every spec is bare,
# then pin the gsource refs on top with dependency resolution switched off.
# Giotto@suite and Giotto@gsource declare identical Imports, so the tree
# already satisfies gsource -- nothing is missing after the swap.
#
# Order in `pins` matters: Giotto@gsource imports symbols that exist only in
# GiottoClass 0.6.0, so it has to come after it.

name: pkgdown

on:
  push:
    branches: [website]
  pull_request:
    branches: [website]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  site:
    # The reusable workflow can only narrow what the caller grants, so the
    # write permission the gh-pages deploy needs has to be declared here.
    permissions:
      contents: write
    uses: giotto-suite/.github/.github/workflows/pkgdown-site.yaml@main
    with:
      mode: release
      examples: "false"
      resolve-packages: |
        github::giotto-suite/Giotto@suite
        github::drieslab/tilework
        arrow
        checkmate
        data.table
        digest
        dplyr
        igraph
        jsonlite
        Matrix
        rlang
        terra
        pkgdown
        sessioninfo
      pins: |
        giotto-suite/GiottoUtils@main
        giotto-suite/GiottoClass@gsource
        giotto-suite/GiottoVisuals@gsource
        giotto-suite/Giotto@gsource
      expect-versions: "GiottoClass=0.6.0,Giotto=4.2.4"
