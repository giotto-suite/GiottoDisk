  - sourceWrite-gDirSource
  - sourceAdopt
  - sourceContains
  - sourcePrune
  - resolveSource
  - coerce_gdsrc
  - sd_view_ref

- title: Stores
  desc: >
    The generic store interface, shared by every backend.
- contents:
  - dataStore-class
  - storeCreate
  - storeRead
  - storeWrite
  - storeWrite-parquetStore
  - storeWrite-parquetGeomStore
  - storeWrite-parquetGeomTileStore
  - storeExists
