url: https://giotto-suite.github.io/GiottoDisk/

authors:
  Ruben Dries:
    href: https://www.drieslab.com
  Jiaji George Chen:
    href: https://github.com/jiajic

template:
  bootstrap: 5
  # katex, not the default mathml: mathml relies on pandoc, which Rd \deqn{}
  # and \eqn{} never pass through, so formulae render as literal source.
  math-rendering: katex
  bslib:
    bg: "#FFFFFF"
    fg: "#000000"
    primary: "#7E69AE"
    code_font: {google: "JetBrains Mono"}
  params:
    search: true

navbar:
  bg: light
  structure:
    left:  [intro, reference, articles, news]
    right: [search, suite, github, lightswitch]
  components:
    reference:
      text: Documentation
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: Architecture and design
        href: articles/design.html
      - text: "gDirSource: the directory-backed source"
        href: articles/gsource.html
      - text: Disk-backed networks with parquetEdgeStore
        href: articles/parquetEdgeStore.html
      - text: Roadmap
        href: articles/roadmap.html
    suite:
      text: Giotto Suite
      href: https://giottosuite.com

reference:
- title: Sources
  desc: >
    A source owns a project directory and the stores inside it.
- contents:
  - gsource
  - gDirSource
  - gDirSource-class
